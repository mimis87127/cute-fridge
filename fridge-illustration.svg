<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">羊管家的可愛冰箱</title><desc id="desc">五個分隔區域的奶油白冰箱，左下有穿黑色管家服拿放大鏡的白羊，右側有提示對話框與睡覺的橘白貓。</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7f4ef"/><stop offset="1" stop-color="#eaf2ed"/></linearGradient>
 <linearGradient id="fridge" x2="1" y2="1"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#e9e5dc"/></linearGradient>
 <linearGradient id="door" x2="0" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#f4eee4"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
<rect width="1200" height="920" rx="42" fill="url(#bg)"/>
<circle cx="170" cy="170" r="95" fill="#f7e7df" opacity=".55"/><circle cx="1030" cy="640" r="150" fill="#dcebe5" opacity=".7"/>
<path d="M65 830 Q310 790 510 840 T1130 820" fill="none" stroke="#d8e4dc" stroke-width="8" stroke-linecap="round"/>
